<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFCF9" />
      <stop offset="50%" stop-color="#F3F8F6" />
      <stop offset="100%" stop-color="#E2F2EE" />
    </linearGradient>

    <!-- 옥돌 기물 그라데이션 -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="40%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- 골드 악센트 그라데이션 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- 카드 그라데이션 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- 부드러운 드롭 섀도우 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <filter id="pieceShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#042F2C" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 1. 앱 아이콘 베이스 (둥근 사각형) -->
  <rect width="600" height="600" rx="135" fill="url(#bgGrad)" />
  <rect width="596" height="596" x="2" y="2" rx="133" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.8" />

  <!-- 은은한 원형 배경 오라 -->
  <circle cx="300" cy="285" r="210" fill="#0D9488" fill-opacity="0.06" />
  <circle cx="300" cy="285" r="160" fill="#0D9488" fill-opacity="0.08" />

  <!-- 2. 뒤편 덱빌딩 카드 2장 (회전 배치) -->
  <!-- 왼쪽 카드 -->
  <g transform="translate(195, 275) rotate(-14)" filter="url(#dropShadow)">
    <rect x="-85" y="-125" width="170" height="250" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="3" />
    <!-- 카드 장식 라인 -->
    <rect x="-72" y="-112" width="144" height="224" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="-55" cy="-82" r="12" fill="#E2E8F0" />
    <text x="-55" y="-77" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#64748B" text-anchor="middle">2</text>
    <text x="0" y="20" font-family="'Batang', 'Gungsuh', serif" font-size="52" font-weight="bold" fill="#94A3B8" text-anchor="middle" opacity="0.4">包</text>
  </g>

  <!-- 오른쪽 카드 -->
  <g transform="translate(405, 275) rotate(14)" filter="url(#dropShadow)">
    <rect x="-85" y="-125" width="170" height="250" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="3" />
    <!-- 카드 장식 라인 -->
    <rect x="-72" y="-112" width="144" height="224" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="-55" cy="-82" r="12" fill="#E2E8F0" />
    <text x="-55" y="-77" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#64748B" text-anchor="middle">5</text>
    <text x="0" y="20" font-family="'Batang', 'Gungsuh', serif" font-size="52" font-weight="bold" fill="#94A3B8" text-anchor="middle" opacity="0.4">車</text>
  </g>

  <!-- 3. 중앙 입체 옥(玉) 장기 기물 (8각형) -->
  <g transform="translate(300, 270)" filter="url(#pieceShadow)">
    <!-- 8각형 외형 -->
    <polygon points="
      -105,-43
      -43,-105
      43,-105
      105,-43
      105,43
      43,105
      -43,105
      -105,43"
      fill="url(#jadeGrad)"
      stroke="url(#goldGrad)"
      stroke-width="7"
      stroke-linejoin="round" />

    <!-- 8각형 내부 골드 라인 -->
    <polygon points="
      -92,-38
      -38,-92
      38,-92
      92,-38
      92,38
      38,92
      -38,92
      -92,38"
      fill="none"
      stroke="#FDE047"
      stroke-width="2.5"
      stroke-opacity="0.8"
      stroke-linejoin="round" />

    <!-- 상단 반사광 하이라이트 -->
    <path d="M -70 -70 Q 0 -95 70 -70 Q 0 -60 -70 -70 Z" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- 한자 '將' (장군) 또는 '楚' (초) 캘리그래피 음각 -->
    <!-- 골드 섀도우 -->
    <text x="0" y="44"
          font-family="'Batang', 'Gungsuh', 'Songti SC', serif"
          font-size="108"
          font-weight="900"
          fill="#064E3B"
          text-anchor="middle"
          opacity="0.9">將</text>
    <!-- 골드 본문 -->
    <text x="0" y="40"
          font-family="'Batang', 'Gungsuh', 'Songti SC', serif"
          font-size="108"
          font-weight="900"
          fill="#FEF08A"
          stroke="#CA8A04"
          stroke-width="1.5"
          text-anchor="middle">將</text>
  </g>

  <!-- 4. 하단 타이틀 뱃지 영역 -->
  <g transform="translate(300, 495)">
    <!-- 타이틀 캡슐 백그라운드 -->
    <rect x="-150" y="-32" width="300" height="64" rx="32" fill="#0F172A" filter="url(#dropShadow)" />
    
    <!-- 메인 타이틀 텍스트 -->
    <text x="0" y="10"
          font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
          font-size="28"
          font-weight="900"
          letter-spacing="4"
          fill="#FFFFFF"
          text-anchor="middle">한 판 장 기</text>
  </g>

</svg>
