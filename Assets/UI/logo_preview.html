<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장기 아케이드 - 공식 앱 아이콘 & 로고</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }
    .subtext {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .logo-container {
      width: 512px;
      height: 512px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(13, 148, 136, 0.2);
      border-radius: 115px;
      overflow: hidden;
      margin-bottom: 28px;
      background: #fdfcf9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px;
      border-radius: 16px;
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #0284c7;
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .logo-container:hover {
      transform: scale(1.02);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8), 0 0 50px rgba(13, 148, 136, 0.35);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 600px;
    }
    .btn {
      padding: 14px 26px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      box-shadow: 0 4px 16px rgba(13, 148, 136, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
      transform: translateY(-2px);
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #2dd4bf;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>장기 아케이드 (Janggi Arcade)</h1>
  <p class="subtext">구글 플레이스토어 512×512 공식 규격 앱 아이콘</p>

  <div class="tabs">
    <button id="tabKo" class="tab-btn active" onclick="switchTab('ko')">🇰🇷 한국어 로고 (장기 아케이드)</button>
    <button id="tabEn" class="tab-btn" onclick="switchTab('en')">🌐 영문 로고 (JANGGI ARCADE)</button>
    <button id="tab3d" class="tab-btn" onclick="switchTab('3d')">🔥 3D 아케이드 로고</button>
    <button id="tabSvg" class="tab-btn" onclick="switchTab('svg')">📐 SVG 벡터 로고</button>
  </div>

  <!-- 1. 한국어 두들 로고 컨테이너 -->
  <div class="logo-container" id="koContainer">
    <img id="koImg" src="janggi_arcade_icon_ko_512x512.png" alt="장기 아케이드 한국어 공식 앱 아이콘">
  </div>

  <!-- 2. 영문 두들 로고 컨테이너 -->
  <div class="logo-container" id="enContainer" style="display: none;">
    <img id="enImg" src="janggi_arcade_icon_en_512x512.png" alt="장기 아케이드 영문 공식 앱 아이콘">
  </div>

  <!-- 3. 3D 아케이드 로고 컨테이너 -->
  <div class="logo-container" id="threeDContainer" style="display: none;">
    <img id="threeDImg" src="janggi_arcade_logo.jpg" alt="장기 아케이드 3D 로고">
  </div>

  <!-- 4. SVG 벡터 그래픽 컨테이너 -->
  <div class="logo-container" id="svgContainer" style="display: none;">
    <svg id="svgElem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="50%" stop-color="#F1F8F6" />
          <stop offset="100%" stop-color="#DBEFEA" />
        </linearGradient>
        <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#34D399" />
          <stop offset="35%" stop-color="#0D9488" />
          <stop offset="100%" stop-color="#064E3B" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FEF08A" />
          <stop offset="50%" stop-color="#F59E0B" />
          <stop offset="100%" stop-color="#B45309" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#F1F5F9" />
        </linearGradient>
        <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="100%" stop-color="#1E293B" />
        </linearGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16" />
        </filter>
        <filter id="pieceShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#022C22" flood-opacity="0.32" />
        </filter>
      </defs>
      <rect width="600" height="600" rx="135" fill="url(#bgGrad)" />
      <rect width="594" height="594" x="3" y="3" rx="132" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9" />
      <circle cx="300" cy="275" r="220" fill="#0D9488" fill-opacity="0.06" />
      <circle cx="300" cy="275" r="165" fill="#0D9488" fill-opacity="0.09" />
      <g transform="translate(190, 260) rotate(-15)" filter="url(#dropShadow)">
        <rect x="-85" y="-125" width="170" height="250" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="3" />
        <rect x="-72" y="-112" width="144" height="224" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
        <circle cx="-52" cy="-80" r="14" fill="#0D9488" />
        <text x="-52" y="-74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="0" y="24" font-family="'Batang', 'Gungsuh', serif" font-size="56" font-weight="bold" fill="#0D9488" text-anchor="middle" opacity="0.75">包</text>
      </g>
      <g transform="translate(410, 260) rotate(15)" filter="url(#dropShadow)">
        <rect x="-85" y="-125" width="170" height="250" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="3" />
        <rect x="-72" y="-112" width="144" height="224" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
        <circle cx="-52" cy="-80" r="14" fill="#0D9488" />
        <text x="-52" y="-74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
        <text x="0" y="24" font-family="'Batang', 'Gungsuh', serif" font-size="56" font-weight="bold" fill="#0D9488" text-anchor="middle" opacity="0.75">車</text>
      </g>
      <g transform="translate(300, 260)" filter="url(#pieceShadow)">
        <polygon points="-108,-45 -45,-108 45,-108 108,-45 108,45 45,108 -45,108 -108,45" fill="url(#jadeGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
        <polygon points="-94,-39 -39,-94 39,-94 94,-39 94,39 39,94 -39,94 -94,39" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-opacity="0.85" stroke-linejoin="round" />
        <path d="M -75 -75 Q 0 -100 75 -75 Q 0 -65 -75 -75 Z" fill="#FFFFFF" fill-opacity="0.4" />
        <text x="0" y="32" font-family="'Batang', 'Gungsuh', 'Apple SD Gothic Neo', serif" font-size="94" font-weight="bold" fill="#FFFFFF" text-anchor="middle" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));">車</text>
      </g>
      <g transform="translate(300, 480)" filter="url(#dropShadow)">
        <rect x="-180" y="-36" width="360" height="72" rx="36" fill="url(#badgeGrad)" stroke="#334155" stroke-width="2.5" />
        <rect x="-175" y="-31" width="350" height="62" rx="31" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">장기 아케이드</text>
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="5" fill="#2DD4BF" text-anchor="middle">JANGGI ARCADE</text>
      </g>
    </svg>
  </div>

  <div class="btn-group">
    <button id="btnDownload512" class="btn btn-primary" onclick="downloadCurrentIcon(512)">
      <span>📥</span> <span id="text512">구글 플레이 아이콘 (512×512 PNG) 다운로드</span>
    </button>
    <button id="btnDownload1024" class="btn btn-secondary" onclick="downloadCurrentIcon(1024)">
      <span>✨</span> <span id="text1024">고해상도 (1024×1024 PNG) 다운로드</span>
    </button>
  </div>

  <div id="status" class="status"></div>

  <script>
    let currentTab = 'ko';

    function switchTab(tab) {
      currentTab = tab;
      const tabKo = document.getElementById('tabKo');
      const tabEn = document.getElementById('tabEn');
      const tab3d = document.getElementById('tab3d');
      const tabSvg = document.getElementById('tabSvg');
      const koContainer = document.getElementById('koContainer');
      const enContainer = document.getElementById('enContainer');
      const threeDContainer = document.getElementById('threeDContainer');
      const svgContainer = document.getElementById('svgContainer');
      const status = document.getElementById('status');

      [tabKo, tabEn, tab3d, tabSvg].forEach(t => t.classList.remove('active'));
      [koContainer, enContainer, threeDContainer, svgContainer].forEach(c => c.style.display = 'none');

      if (tab === 'ko') {
        tabKo.classList.add('active');
        koContainer.style.display = 'flex';
        status.innerText = '🇰🇷 한국어 로고 (장기 아케이드)가 선택되었습니다.';
      } else if (tab === 'en') {
        tabEn.classList.add('active');
        enContainer.style.display = 'flex';
        status.innerText = '🌐 영문 로고 (JANGGI ARCADE)가 선택되었습니다.';
      } else if (tab === '3d') {
        tab3d.classList.add('active');
        threeDContainer.style.display = 'flex';
        status.innerText = '🔥 3D 아케이드 로고가 선택되었습니다.';
      } else {
        tabSvg.classList.add('active');
        svgContainer.style.display = 'flex';
        status.innerText = '📐 SVG 벡터 로고가 선택되었습니다.';
      }
    }

    function downloadCurrentIcon(size) {
      const status = document.getElementById('status');
      let filename = '';

      if (currentTab === 'ko') {
        filename = size === 512 ? 'janggi_arcade_icon_ko_512x512.png' : 'janggi_arcade_icon_ko_1024x1024.png';
      } else if (currentTab === 'en') {
        filename = size === 512 ? 'janggi_arcade_icon_en_512x512.png' : 'janggi_arcade_icon_en_1024x1024.png';
      } else if (currentTab === '3d') {
        filename = 'janggi_arcade_logo.jpg';
      }

      if (filename) {
        const link = document.createElement('a');
        link.download = filename;
        link.href = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        status.innerText = `✅ [${filename}] 다운로드가 완료되었습니다!`;
        return;
      }

      // SVG 탭 다운로드
      const svgElem = document.getElementById('svgElem');
      const svgXml = new XMLSerializer().serializeToString(svgElem);
      const svgBase64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgXml);

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);

        try {
          const pngUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `janggi_arcade_svg_${size}x${size}.png`;
          link.href = pngUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          status.innerText = `✅ [SVG ${size}×${size}] 다운로드가 완료되었습니다!`;
        } catch (e) {
          status.innerText = '오류: ' + e.message;
          console.error(e);
        }
      };
      img.src = svgBase64;
    }
  </script>
</body>
</html>
