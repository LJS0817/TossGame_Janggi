<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장기 아케이드 - 구글 플레이 대표 그래픽 (Feature Graphic 1024×500)</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 6px;
      font-size: 26px;
      color: #f1f5f9;
      font-weight: 800;
    }
    p {
      margin-top: 0;
      margin-bottom: 20px;
      color: #94a3b8;
      font-size: 15px;
    }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #1d74b2;
      border-color: #38bdf8;
      color: white;
      box-shadow: 0 0 16px rgba(29, 116, 178, 0.4);
    }
    .thumb-wrapper {
      max-width: 1024px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(29, 116, 178, 0.2);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid #334155;
      background: #0f172a;
    }
    .thumb-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    .btn-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 14px 28px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1d74b2, #15588c);
      box-shadow: 0 4px 16px rgba(29, 116, 178, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #258ad4, #1d74b2);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
      transform: translateY(-2px);
    }
    .status {
      margin-top: 14px;
      font-size: 15px;
      color: #38bdf8;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <h1>장기 아케이드 - 구글 플레이 대표 그래픽 (Feature Graphic)</h1>
  <p>구글 플레이스토어 공식 규격: 1024×500 px (PNG / JPEG, 최대 15MB)</p>

  <div class="tabs">
    <button id="tabKo" class="tab-btn active" onclick="switchLang('ko')">🇰🇷 한국어 버전 (Korean)</button>
    <button id="tabEn" class="tab-btn" onclick="switchLang('en')">🌐 영어 버전 (English - Global)</button>
  </div>

  <div class="thumb-wrapper">
    <img id="featureImg" src="janggi_arcade_feature_graphic_1024x500.png" alt="장기 아케이드 대표 그래픽">
  </div>

  <div class="btn-group">
    <a id="btnDownload" href="janggi_arcade_feature_graphic_1024x500.png" download="janggi_arcade_feature_graphic_1024x500.png" class="btn btn-primary">
      <span>📥</span> <span id="btnText">한국어 대표 그래픽 (1024×500 PNG) 다운로드</span>
    </a>
    <a href="janggi_arcade_feature_graphic_en_1024x500.png" download="janggi_arcade_feature_graphic_en_1024x500.png" class="btn btn-secondary">
      <span>🌐</span> English Feature Graphic (1024×500 PNG)
    </a>
  </div>

  <div id="status" class="status"></div>

  <script>
    let currentLang = 'ko';

    function switchLang(lang) {
      currentLang = lang;
      const tabKo = document.getElementById('tabKo');
      const tabEn = document.getElementById('tabEn');
      const img = document.getElementById('featureImg');
      const btn = document.getElementById('btnDownload');
      const btnText = document.getElementById('btnText');
      const status = document.getElementById('status');

      if (lang === 'ko') {
        tabKo.classList.add('active');
        tabEn.classList.remove('active');
        img.src = 'janggi_arcade_feature_graphic_1024x500.png';
        btn.href = 'janggi_arcade_feature_graphic_1024x500.png';
        btn.download = 'janggi_arcade_feature_graphic_1024x500.png';
        btnText.innerText = '한국어 대표 그래픽 (1024×500 PNG) 다운로드';
        status.innerText = '🇰🇷 한국어 대표 그래픽 (1024×500)으로 전환되었습니다.';
      } else {
        tabEn.classList.add('active');
        tabKo.classList.remove('active');
        img.src = 'janggi_arcade_feature_graphic_en_1024x500.png';
        btn.href = 'janggi_arcade_feature_graphic_en_1024x500.png';
        btn.download = 'janggi_arcade_feature_graphic_en_1024x500.png';
        btnText.innerText = 'English Feature Graphic (1024×500 PNG) Download';
        status.innerText = '🌐 English Global Feature Graphic (1024×500) selected.';
      }
    }
  </script>
</body>
</html>
