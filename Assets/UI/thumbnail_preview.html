<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한판 장기 - 1932x828 공식 썸네일</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
      color: #f1f5f9;
    }
    p {
      margin-top: 0;
      margin-bottom: 20px;
      color: #94a3b8;
      font-size: 15px;
    }
    .thumb-wrapper {
      max-width: 966px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid #334155;
    }
    .thumb-wrapper svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .btn {
      padding: 16px 36px;
      font-size: 19px;
      font-weight: bold;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(13, 148, 136, 0.4);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #0f766e;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .status {
      margin-top: 14px;
      font-size: 15px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>한판 장기 - 토스 인앱 게임 공식 썸네일 (1932 × 828 px)</h1>
  <p>규격: 1932 × 828 px | 가로형 배너</p>

  <div class="thumb-wrapper">
    <svg id="svgElem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1932 828" width="1932" height="828">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="50%" stop-color="#1E293B" />
          <stop offset="100%" stop-color="#0F2D2A" />
        </linearGradient>
        <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2DD4BF" />
          <stop offset="50%" stop-color="#0D9488" />
          <stop offset="100%" stop-color="#0F766E" />
        </linearGradient>
        <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FB7185" />
          <stop offset="50%" stop-color="#E11D48" />
          <stop offset="100%" stop-color="#9F1239" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FEF08A" />
          <stop offset="50%" stop-color="#EAB308" />
          <stop offset="100%" stop-color="#CA8A04" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#F1F5F9" />
        </linearGradient>
        <filter id="heroShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.45" />
        </filter>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="30" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- 배경 베이스 -->
      <rect width="1932" height="828" fill="url(#bgGrad)" />

      <!-- 배경 오라 & 빛 효과 -->
      <circle cx="1450" cy="414" r="450" fill="#0D9488" fill-opacity="0.18" filter="url(#glow)" />
      <circle cx="1650" cy="300" r="300" fill="#E11D48" fill-opacity="0.12" filter="url(#glow)" />
      <circle cx="350" cy="200" r="300" fill="#EAB308" fill-opacity="0.08" filter="url(#glow)" />

      <!-- 배경 장기판 격자 라인 패턴 -->
      <g opacity="0.12" transform="translate(1050, -50) rotate(-15)">
        <line x1="0" y1="100" x2="1000" y2="100" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="200" x2="1000" y2="200" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="300" x2="1000" y2="300" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="400" x2="1000" y2="400" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="500" x2="1000" y2="500" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="600" x2="1000" y2="600" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="700" x2="1000" y2="700" stroke="#CBD5E1" stroke-width="2" />
        <line x1="0" y1="800" x2="1000" y2="800" stroke="#CBD5E1" stroke-width="2" />
        <line x1="100" y1="0" x2="100" y2="900" stroke="#CBD5E1" stroke-width="2" />
        <line x1="250" y1="0" x2="250" y2="900" stroke="#CBD5E1" stroke-width="2" />
        <line x1="400" y1="0" x2="400" y2="900" stroke="#CBD5E1" stroke-width="2" />
        <line x1="550" y1="0" x2="550" y2="900" stroke="#CBD5E1" stroke-width="2" />
        <line x1="700" y1="0" x2="700" y2="900" stroke="#CBD5E1" stroke-width="2" />
        <line x1="850" y1="0" x2="850" y2="900" stroke="#CBD5E1" stroke-width="2" />
      </g>

      <!-- 우측 비주얼: 덱빌딩 카드 & 3D 장기 기물 -->
      <!-- 차(車) 카드 -->
      <g transform="translate(1260, 430) rotate(-22)" filter="url(#heroShadow)">
        <rect x="-110" y="-165" width="220" height="330" rx="24" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="4" />
        <rect x="-95" y="-150" width="190" height="300" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2" />
        <rect x="-90" y="-145" width="40" height="40" rx="10" fill="#0D9488" />
        <text x="-70" y="-118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
        <text x="0" y="45" font-family="'Batang', 'Gungsuh', serif" font-size="95" font-weight="900" fill="#0D9488" text-anchor="middle">車</text>
        <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#64748B" text-anchor="middle">전차</text>
      </g>

      <!-- 포(包) 카드 -->
      <g transform="translate(1620, 420) rotate(18)" filter="url(#heroShadow)">
        <rect x="-110" y="-165" width="220" height="330" rx="24" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="4" />
        <rect x="-95" y="-150" width="190" height="300" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2" />
        <rect x="-90" y="-145" width="40" height="40" rx="10" fill="#0D9488" />
        <text x="-70" y="-118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="0" y="45" font-family="'Batang', 'Gungsuh', serif" font-size="95" font-weight="900" fill="#0D9488" text-anchor="middle">包</text>
        <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#64748B" text-anchor="middle">포</text>
      </g>

      <!-- 한(漢) 루비 기물 -->
      <g transform="translate(1680, 180)" filter="url(#heroShadow)">
        <polygon points="
          -65,-27
          -27,-65
          27,-65
          65,-27
          65,27
          27,65
          -27,65
          -65,27"
          fill="url(#rubyGrad)"
          stroke="#FECDD3"
          stroke-width="4"
          stroke-linejoin="round" />
        <text x="0" y="25"
              font-family="'Batang', 'Gungsuh', serif"
              font-size="68"
              font-weight="900"
              fill="#FFFFFF"
              text-anchor="middle">漢</text>
      </g>

      <!-- 메인 히어로 기물: '將' -->
      <g transform="translate(1440, 420)" filter="url(#heroShadow)">
        <polygon points="
          -155,-64
          -64,-155
          64,-155
          155,-64
          155,64
          64,155
          -64,155
          -155,64"
          fill="url(#jadeGrad)"
          stroke="url(#goldGrad)"
          stroke-width="10"
          stroke-linejoin="round" />

        <polygon points="
          -138,-56
          -56,-138
          56,-138
          138,-56
          138,56
          56,138
          -56,138
          -138,56"
          fill="none"
          stroke="#FEF08A"
          stroke-width="3.5"
          stroke-opacity="0.8"
          stroke-linejoin="round" />

        <path d="M -110 -110 Q 0 -140 110 -110 Q 0 -90 -110 -110 Z" fill="#FFFFFF" fill-opacity="0.35" />

        <text x="0" y="65"
              font-family="'Batang', 'Gungsuh', 'Songti SC', serif"
              font-size="160"
              font-weight="900"
              fill="#042F2C"
              text-anchor="middle"
              opacity="0.9">將</text>
        <text x="0" y="60"
              font-family="'Batang', 'Gungsuh', 'Songti SC', serif"
              font-size="160"
              font-weight="900"
              fill="#FEF08A"
              stroke="#CA8A04"
              stroke-width="2"
              text-anchor="middle">將</text>
      </g>

      <!-- 마(馬) 기물 -->
      <g transform="translate(1200, 620)" filter="url(#heroShadow)">
        <polygon points="
          -55,-23
          -23,-55
          23,-55
          55,-23
          55,23
          23,55
          -23,55
          -55,23"
          fill="url(#jadeGrad)"
          stroke="url(#goldGrad)"
          stroke-width="4"
          stroke-linejoin="round" />
        <text x="0" y="20"
              font-family="'Batang', 'Gungsuh', serif"
              font-size="56"
              font-weight="900"
              fill="#FEF08A"
              text-anchor="middle">馬</text>
      </g>

      <!-- 좌측 타이틀 & 카피 -->
      <g transform="translate(140, 160)">
        <g transform="translate(0, 0)">
          <rect width="210" height="46" rx="23" fill="#0D9488" fill-opacity="0.25" stroke="#2DD4BF" stroke-width="1.5" />
          <text x="105" y="30"
                font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="20"
                font-weight="bold"
                letter-spacing="2"
                fill="#2DD4BF"
                text-anchor="middle">⚡ AI 덱빌딩 디펜스</text>
        </g>

        <text x="0" y="165"
              font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
              font-size="112"
              font-weight="900"
              letter-spacing="8"
              fill="#FFFFFF">한 판 장 기</text>

        <text x="6" y="225"
              font-family="-apple-system, BlinkMacSystemFont, sans-serif"
              font-size="34"
              font-weight="900"
              letter-spacing="10"
              fill="url(#goldGrad)">ONE MATCH JANGGI</text>

        <g transform="translate(6, 290)">
          <rect x="-10" y="-36" width="620" height="60" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
          <text x="15" y="5"
                font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"
                font-size="26"
                font-weight="bold"
                fill="#F8FAFC">카드로 소환하는 3분 장기 덱배틀</text>
        </g>

        <g transform="translate(6, 400)">
          <g transform="translate(0, 0)">
            <rect width="190" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
            <text x="95" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">🃏 실시간 카드 소환</text>
          </g>
          <g transform="translate(205, 0)">
            <rect width="190" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
            <text x="95" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">🤖 4단계 AI 대결</text>
          </g>
          <g transform="translate(410, 0)">
            <rect width="190" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
            <text x="95" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">⚔️ 20 코스트 수싸움</text>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <button class="btn" onclick="downloadPng()">PNG로 1932x828 다운로드</button>
  <div id="status" class="status"></div>

  <script>
    function downloadPng() {
      const status = document.getElementById('status');
      status.innerText = '고해상도 1932x828 PNG 렌더링 중...';

      const svgElem = document.getElementById('svgElem');
      const svgXml = new XMLSerializer().serializeToString(svgElem);
      const svgBase64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgXml);

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 1932;
        canvas.height = 828;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1932, 828);
        ctx.drawImage(img, 0, 0, 1932, 828);

        try {
          const pngUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = 'hanpan_janggi_thumbnail_1932x828.png';
          link.href = pngUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          status.innerText = '✅ 1932x828 고해상도 썸네일 다운로드가 완료되었습니다!';
        } catch (e) {
          status.innerText = '오류: ' + e.message;
          console.error(e);
        }
      };

      img.onerror = function(err) {
        status.innerText = '이미지 로드 오류가 발생했습니다.';
        console.error(err);
      };

      img.src = svgBase64;
    }
  </script>
</body>
</html>
